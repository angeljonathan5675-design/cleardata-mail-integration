name: Cloud account checkpoint
on:
  workflow_dispatch:
    inputs:
      verify_credentials:
        description: 'Run the one-time Frantic credential verification when needed'
        required: false
        type: boolean
        default: false
      verify_near_credentials:
        description: 'One-time verification of the owned NEAR worker token; no other service reads'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '37 * * * *'
permissions:
  contents: read
concurrency:
  group: cloud-account-checkpoint
  cancel-in-progress: false
jobs:
  private-api-reads:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check out fixed worker source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read existing accounts without exposing credentials
        env:
          SPEEDBOT_AGENT_KEY: ${{ (github.event_name != 'workflow_dispatch' || !inputs.verify_near_credentials) && secrets.SPEEDBOT_AGENT_KEY || '' }}
          NEAR_AGENT_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_near_credentials && secrets.NEAR_AGENT_TOKEN || '' }}
          VERIFY_NEAR_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_near_credentials && 'true' || 'false' }}
          FRANTIC_AGENT_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_credentials && !inputs.verify_near_credentials && secrets.FRANTIC_AGENT_TOKEN || '' }}
        run: python3 cloud_checkpoint.py
